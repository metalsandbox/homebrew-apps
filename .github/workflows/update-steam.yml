name: Check Steam bootstrapper
on:
  schedule:
    - cron: '31 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-steam
  cancel-in-progress: false
jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify candidate and open review PR
        shell: bash
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check-upstream.py --write
          if git diff --quiet -- Casks/steam-arm64.rb; then exit 0; fi
          ruby -c Casks/steam-arm64.rb
          brew tap metalsandbox/apps "$GITHUB_WORKSPACE"
          brew trust --cask metalsandbox/apps/steam-arm64
          brew install --cask --appdir="$RUNNER_TEMP/apps" metalsandbox/apps/steam-arm64
          brew uninstall --cask metalsandbox/apps/steam-arm64
          branch="automation/steam-$(shasum -a 256 Casks/steam-arm64.rb | cut -c1-16)"
          existing_pr=$(gh pr list --base main --head "$branch" --state all --limit 1 --json url --jq '.[0].url // empty')
          if [ -n "$existing_pr" ]; then
            echo "Update already proposed in $existing_pr"
            exit 0
          fi

          remote_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote_branch" ]; then
            git fetch --no-tags origin "refs/heads/$branch"
            git show FETCH_HEAD:Casks/steam-arm64.rb | cmp - Casks/steam-arm64.rb
          else
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Casks/steam-arm64.rb
            git commit -m 'Update verified Steam ARM64 bootstrapper'
            git push origin "$branch"
          fi
          if ! gh pr create --base main --head "$branch" --title 'Update Steam ARM64 bootstrapper' --body 'The update workflow verified the Valve stable download, SHA-256, ARM64 slice, Valve Developer ID, Gatekeeper, and isolated Homebrew installation. Style and audit require a separate opt-in run. Human review is required before merging.'; then
            printf 'The verified Steam update branch is ready. [Open the pull request manually](https://github.com/%s/compare/main...%s?expand=1).\n' "$GH_REPO" "$branch" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
