name: Update OffPDF cask

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-offpdf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check latest release and update cask
        run: python3 scripts/update_offpdf.py
      - name: Validate cask syntax
        run: ruby -c Casks/offpdf.rb
      - name: Commit update
        run: |
          if git diff --quiet -- Casks/offpdf.rb; then
            echo "OffPDF cask is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/offpdf.rb
          git commit -m "Update OffPDF cask"
          git push
